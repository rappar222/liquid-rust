<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad2d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow2d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#06B6D4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad2d)" stroke="#06B6D4" stroke-width="3" stroke-opacity="0.4" />

  <!-- 2D Planar Grid lines -->
  <line x1="48" y1="80" x2="208" y2="80" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="48" y1="120" x2="208" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="48" y1="160" x2="208" y2="160" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="88" y1="48" x2="88" y2="208" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="128" y1="48" x2="128" y2="208" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
  <line x1="168" y1="48" x2="168" y2="208" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- 2D Planar Fluid Wave Front (Layer 1 - deep) -->
  <path d="M 32 170 C 64 150, 96 195, 128 175 C 160 155, 192 180, 224 160 L 224 212 C 224 220, 218 224, 210 224 L 46 224 C 38 224, 32 220, 32 212 Z"
        fill="url(#waveGrad1)" opacity="0.6" />

  <!-- 2D Planar Fluid Wave Front (Layer 2 - crisp crest) -->
  <path d="M 32 185 C 70 160, 100 200, 136 170 C 172 140, 196 170, 224 150 L 224 214 C 224 220, 218 224, 210 224 L 46 224 C 38 224, 32 220, 32 214 Z"
        fill="url(#waveGrad2)" filter="url(#shadow2d)" />

  <!-- 2D Circular Fluid Particles / Droplets on planar sheet -->
  <circle cx="70" cy="115" r="14" fill="#34D399" filter="url(#shadow2d)" />
  <circle cx="110" cy="85" r="18" fill="#38BDF8" filter="url(#shadow2d)" />
  <circle cx="150" cy="110" r="12" fill="#818CF8" filter="url(#shadow2d)" />
  <circle cx="185" cy="75" r="9" fill="#F472B6" />

  <!-- 2D BADGE -->
  <rect x="142" y="32" width="76" height="38" rx="12" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2" />
  <text x="180" y="59" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">2D</text>
</svg>