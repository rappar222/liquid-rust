<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#243B55" />
    </linearGradient>
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0091EA" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0091EA" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.3" />

  <!-- 3D Cube / Chamber Perspective Wireframe Grid behind fluid -->
  <path d="M 64 88 L 128 56 L 192 88 L 128 120 Z" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4,4" />
  <path d="M 64 88 L 64 168 L 128 200 L 128 120" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.4" />
  <path d="M 192 88 L 192 168 L 128 200" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Fluid Splash / Droplet in 3D -->
  <path d="M 128 62 C 128 62 178 126 178 162 C 178 189.6 155.6 212 128 212 C 100.4 212 78 189.6 78 162 C 78 126 128 62 128 62 Z"
        fill="url(#fluidGrad)" filter="url(#shadow)" />

  <!-- Highlight gloss on droplet -->
  <path d="M 128 76 C 128 76 160 128 160 156 C 160 168 152 176 142 176 C 132 176 130 162 128 150 C 126 138 124 116 128 76 Z"
        fill="url(#highlightGrad)" />

  <!-- Dynamic splash droplets -->
  <circle cx="178" cy="100" r="10" fill="#00E5FF" opacity="0.85" filter="url(#shadow)" />
  <circle cx="78" cy="116" r="7" fill="#38BDF8" opacity="0.75" />
  <circle cx="190" cy="140" r="5" fill="#E0F7FA" opacity="0.9" />
</svg>