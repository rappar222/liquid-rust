name: LiquidRust
options:
  bundleIdPrefix: com.liquidrust
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    MTL_FAST_MATH: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  LiquidRust:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: LiquidRust/Sources
      - path: LiquidRust/Shaders
      - path: LiquidRust/Assets.xcassets
    info:
      path: LiquidRust/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liquidrust.ios
        PRODUCT_NAME: LiquidRust
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreMotion.framework
      - sdk: QuartzCore.framework
